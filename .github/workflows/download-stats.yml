name: Download Stats

on:
  schedule:
    # Daily at 09:00 UTC
    - cron: "0 9 * * *"
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate download stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-download-stats.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/download-stats.svg; then
            echo "No changes to download-stats.svg"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/download-stats.svg
          git commit -m "chore: refresh download stats"
          git push
